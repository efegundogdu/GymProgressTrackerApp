<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - Gym P.T.</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1540497077202-7c8a3999166f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .main-wrapper {
            display: flex;
            width: 85%;
            max-width: 1100px;
            align-items: center;
            justify-content: space-between;
        }
        .hero-text { color: white; flex: 1; }
        .hero-text h1 { font-size: 5em; margin: 0; font-weight: 900; }
        .hero-text p { font-size: 1.8em; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="hero-text">
            <h1>Gym P.T.</h1>
            <p>Hoş geldin şampiyon, <br>kaldığın yerden devam et.</p>
        </div>
        <div class="container" style="margin: 0; flex: 0 0 400px; background: rgba(255, 255, 255, 0.95);">
            <h2 style="color: #2c3e50;">Giriş Yap</h2>
            <form action="/login" method="POST">
                <input type="text" name="username" placeholder="Kullanıcı Adı" required>
                <input type="password" name="password" placeholder="Şifre" required>
                <button type="submit" style="background: #27ae60;">Giriş Yap</button>
            </form>
            <p style="text-align: center; margin-top: 20px;">
                Hesabın yok mu? <a href="/register" style="color: #3498db; font-weight: bold;">Kayıt Ol</a>
            </p>
        </div>
    </div>
</body>
</html>
