<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gym P.T. - Hoş Geldiniz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Arka plan fotoğrafı*/
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .main-wrapper {
            display: flex;
            width: 90%;
            max-width: 1200px;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }
        .hero-text {
            flex: 1;
            color: white;
            text-shadow: 3px 3px 15px rgba(0,0,0,0.6);
        }
        .hero-text h1 {
            font-size: 5.5em;
            margin: 0;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 1;
        }
        .hero-text p {
            font-size: 1.8em;
            margin-top: 20px;
            opacity: 0.95;
            line-height: 1.3;
            font-weight: 300;
        }
        .login-card {
            flex: 0 0 420px;
        }
        /* Cam Efektli Kutu */
        .glass-container {
            background: rgba(255, 255, 255, 0.92);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn {
            display: block;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-login {
            background: #27ae60;
            color: white;
            margin-bottom: 15px;
        }
        .btn-login:hover {
            background: #219150;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }
        .btn-reg {
            background: #3498db;
            color: white;
        }
        .btn-reg:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        /* Çıkış butonu kırmızı */
        .btn-logout {
            background: #e74c3c;
            color: white;
        }
        .btn-logout:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="hero-text">
            <h1>Gym P.T.</h1>
            <p>Sınırlarını zorla, gelişimini <br><strong>set set</strong> verilerle kanıtla.</p>
        </div>
        
        <div class="login-card">
            <div class="glass-container">
                <h2 style="color: #2c3e50; margin-top: 0; font-size: 1.8rem;">Gelişimi Takip Et</h2>
                
                <div style="display: flex; flex-direction: column;">
                    {% if username %}
                        <p style="color: #555; margin-bottom: 25px; line-height: 1.5;">
                            Tekrar hoş geldin, <strong>{{ username }}</strong>!<br>Hazırsan devam edelim.
                        </p>
                        <a href="/dashboard" class="btn btn-login">Dashboard'a Git</a>
                        <a href="/logout" class="btn btn-logout">Çıkış Yap</a>
                    {% else %}
                        <p style="color: #555; margin-bottom: 35px; line-height: 1.5;">Just do it.</p>
                        <a href="/login" class="btn btn-login">Giriş Yap</a>
                        <a href="/register" class="btn btn-reg">Hemen Kayıt Ol</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
