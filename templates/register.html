<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - Gym P.T.</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Arka plan fotoğrafı (Uyumlu Bulduğum) */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-wrapper {
            display: flex;
            width: 85%;
            max-width: 1100px;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }
        .hero-text {
            flex: 1;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        .hero-text h1 {
            font-size: 5em;
            margin: 0;
            font-weight: 900;
            letter-spacing: -2px;
        }
        .hero-text p {
            font-size: 1.8em;
            margin-top: 10px;
            opacity: 0.9;
            line-height: 1.2;
        }
        .register-card {
            flex: 0 0 400px;
        }
        /* Glassmorphism etkisi */
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            margin: 0; 
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="hero-text">
            <h1>Gym P.T.</h1>
            <p>Bugün başla, <br>yarın kendine teşekkür et.</p>
        </div>

        <div class="register-card">
            <div class="container">
                <h2 style="color: #2c3e50; margin-top: 0;">Hesap Oluştur</h2>
                <p style="color: #666; margin-bottom: 25px;">Hemen aramıza katıl ve antrenmanlarını kaydetmeye başla.</p>
                
                <form action="/register" method="POST">
                    <input type="text" name="username" placeholder="Kullanıcı Adı" required>
                    <input type="password" name="password" placeholder="Şifre" required>
                    <button type="submit" style="background-color: #3498db; margin-top: 10px;">Kayıt Ol</button>
                </form>
                
                <p style="text-align: center; margin-top: 20px; color: #333;">
                    Zaten hesabın var mı? <a href="/login" style="color: #27ae60; font-weight: bold;">Giriş Yap</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
